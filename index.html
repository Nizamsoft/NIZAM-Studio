<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#171614">
<meta name="description" content="Nizam Soft yazılım üretim yönetim sistemi">

<meta property="og:type" content="website">
<meta property="og:site_name" content="NIZAM | Studio">
<meta property="og:title" content="NIZAM | Studio">
<meta property="og:description" content="Müşteri talebini yapılandırılmış göreve, AI promptuna ve sürüme çeviren iç araç.">
<meta property="og:image" content="icon-512.png">
<meta name="twitter:card" content="summary">
<title>NIZAM | Studio</title>

<link rel="manifest" href="manifest.webmanifest">
<!-- iOS ana ekran simgesi 180 piksel ister; 192 gelince yeniden ölçeklerdi. -->
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- black-translucent, sayfayı ekranın TEPESİNE yapıştırıp altta 59 piksel
     boş bırakıyordu (o siyah şerit). "black" ile sayfa durum çubuğunun
     altından başlar ve ekranın gerçek dibine kadar iner. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="NIZAM Studio">

<link rel="stylesheet" href="style.css?v=0.18.0">
</head>
<body>

<!-- ===== Açılış ekranı ===== -->
<div id="loader">
  <div class="loader-box">
    <img draggable="false" class="loader-logo" src="logo-full.png?v=0.2.1" alt="NIZAM Studio" width="118" height="128">
    <div class="loader-sub">Nizam Soft</div>
    <div class="loader-track"><div class="loader-fill"></div></div>
    <div class="loader-msg">Hazırlanıyor…</div>
  </div>
  <div class="loader-foot">Yazılım Üretim Yönetim Sistemi</div>
</div>

<!-- ===== Giriş ekranı ===== -->
<div id="login" class="hidden">
  <form class="login-card" id="login-form" autocomplete="on">
    <img class="login-logo" src="logo-n.png?v=0.2.1" alt="" width="57" height="66">
    <h1>NIZAM <span class="pipe">|</span> Studio</h1>
    <p class="login-sub">Nizam Soft</p>

    <label class="field">
      <span>E-posta</span>
      <input type="email" id="login-mail" placeholder="ad@nizamsoft.com" autocomplete="username">
    </label>
    <label class="field">
      <span>Şifre</span>
      <input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password">
    </label>

    <p class="login-error hidden" id="login-error" role="alert"></p>

    <button class="btn btn-primary btn-block" type="submit"><span>Giriş Yap</span></button>
    <p class="login-note">Hesabı olmayan giremez. Erişim için yöneticine başvur.</p>
  </form>
</div>

<!-- ===== Uygulama ===== -->
<div id="app" class="hidden">

  <aside id="sidebar">
    <div class="brand">
      <img class="brand-logo" src="logo-n.png?v=0.2.1" alt="" width="24" height="28">
      <div class="brand-text">
        <div class="brand-name">NIZAM <span class="pipe">|</span> Studio</div>
        <div class="brand-sub">Nizam Soft</div>
      </div>
    </div>

    <nav class="nav"></nav>

    <div class="spacer"></div>

    <div class="rail-surum" id="rail-surum">—</div>

    <button class="user-chip" id="user-chip" type="button">
      <span class="avatar">NA</span>
      <span class="user-text">
        <span class="user-name">Nizam</span>
        <span class="user-role">Yönetici</span>
      </span>
    </button>
  </aside>

  <div id="main">
    <header id="topbar">
      <button class="icon-btn hidden" id="btn-back" type="button" aria-label="Geri">
        <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"></path></svg>
      </button>
      <span class="logo-kutu"><img draggable="false" src="logo-n.png" alt="" width="24" height="24"></span>
      <div class="marka">
        <b id="firma-adi">NIZAM <span class="pipe">|</span> Studio</b>
        <i id="page-title">Panel</i>
      </div>
      <div class="spacer"></div>
      <button class="btn btn-primary only-desktop" id="topbar-action" type="button">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg>
        <span>Yeni Proje</span>
      </button>
      <button class="hesap" id="user-tile" type="button" aria-label="Hesap">
        <span class="hesap-yazi">
          <span class="user-role">Yönetici</span>
          <span class="user-name">Nizam</span>
        </span>
        <span class="foto"><b class="avatar">NA</b><em class="nokta hidden">0</em></span>
      </button>
    </header>

    <!-- Panelin zemin süsü: iki soluk hâle ve dev filigran. Yalnızca Panel'de
         görünür, içeriğin arkasında durur, dokunmayı engellemez. -->
    <div id="zemin-sus" aria-hidden="true">
      <span class="hale-kirmizi"></span>
      <span class="hale-metal"></span>
      <img class="filigran" src="logo-n.png" alt="" width="190" height="206" draggable="false">
    </div>

    <main id="view" class="view"></main>
  </div>

  <nav id="tabbar"></nav>
</div>

<!-- Alt sekme simgelerinin kabartma gradyanları. Görünmez, yalnızca tanım taşır. -->
<svg width="0" height="0" aria-hidden="true" style="position:absolute">
  <defs>
    <!-- Panel ilerleme halkası -->
    <linearGradient id="halka-metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f0ed"></stop>
      <stop offset=".5" stop-color="#c2bab4"></stop>
      <stop offset="1" stop-color="#7a716a"></stop>
    </linearGradient>
    <linearGradient id="yan-kirmizi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#932018"></stop>
      <stop offset="1" stop-color="#5a110c"></stop>
    </linearGradient>
  </defs>
</svg>

<div id="toast" class="hidden"></div>

<script src="vendor/supabase.js?v=2.112.3"></script>
<script src="config.js?v=0.18.0"></script>
<script src="auth.js?v=0.18.0"></script>
<script src="data.js?v=0.18.0"></script>
<script src="guncelle.js?v=0.18.0"></script>
<script src="prompt.js?v=0.18.0"></script>
<script src="app.js?v=0.18.0"></script>
</body>
</html>
