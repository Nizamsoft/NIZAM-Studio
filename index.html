<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#171614">
<meta name="description" content="Nizam Soft yazılım üretim yönetim sistemi">

<meta property="og:type" content="website">
<meta property="og:site_name" content="NIZAM | Studio">
<meta property="og:title" content="NIZAM | Studio">
<meta property="og:description" content="Müşteri talebini yapılandırılmış göreve, AI promptuna ve sürüme çeviren iç araç.">
<meta property="og:image" content="icon-512.png">
<meta name="twitter:card" content="summary">
<title>NIZAM | Studio</title>

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- black-translucent, sayfayı ekranın TEPESİNE yapıştırıp altta 59 piksel
     boş bırakıyordu (o siyah şerit). "black" ile sayfa durum çubuğunun
     altından başlar ve ekranın gerçek dibine kadar iner. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="NIZAM Studio">

<link rel="stylesheet" href="style.css?v=0.9.5">
</head>
<body>

<!-- ===== Açılış ekranı ===== -->
<div id="loader">
  <div class="loader-box">
    <img class="loader-logo" src="logo-full.png?v=0.2.1" alt="NIZAM Studio" width="118" height="128">
    <div class="loader-sub">Nizam Soft</div>
    <div class="loader-track"><div class="loader-fill"></div></div>
    <div class="loader-msg">Hazırlanıyor…</div>
  </div>
  <div class="loader-foot">Yazılım Üretim Yönetim Sistemi</div>
</div>

<!-- ===== Giriş ekranı ===== -->
<div id="login" class="hidden">
  <form class="login-card" id="login-form" autocomplete="on">
    <img class="login-logo" src="logo-n.png?v=0.2.1" alt="" width="57" height="66">
    <h1>NIZAM <span class="pipe">|</span> Studio</h1>
    <p class="login-sub">Nizam Soft</p>

    <label class="field">
      <span>E-posta</span>
      <input type="email" id="login-mail" placeholder="ad@nizamsoft.com" autocomplete="username">
    </label>
    <label class="field">
      <span>Şifre</span>
      <input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password">
    </label>

    <p class="login-error hidden" id="login-error" role="alert"></p>

    <button class="btn btn-primary btn-block" type="submit"><span>Giriş Yap</span></button>
    <p class="login-note">Hesabı olmayan giremez. Erişim için yöneticine başvur.</p>
  </form>
</div>

<!-- ===== Uygulama ===== -->
<div id="app" class="hidden">

  <aside id="sidebar">
    <div class="brand">
      <img class="brand-logo" src="logo-n.png?v=0.2.1" alt="" width="24" height="28">
      <div class="brand-text">
        <div class="brand-name">NIZAM <span class="pipe">|</span> Studio</div>
        <div class="brand-sub">Nizam Soft</div>
      </div>
    </div>

    <nav class="nav"></nav>

    <div class="spacer"></div>

    <div class="rail-surum" id="rail-surum">—</div>

    <button class="user-chip" id="user-chip" type="button">
      <span class="avatar">NA</span>
      <span class="user-text">
        <span class="user-name">Nizam</span>
        <span class="user-role">Yönetici</span>
      </span>
    </button>
  </aside>

  <div id="main">
    <header id="topbar">
      <button class="icon-btn hidden" id="btn-back" type="button" aria-label="Geri">
        <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"></path></svg>
      </button>
      <div class="topbar-title">
        <h1 id="page-title">Panel</h1>
        <p id="page-sub">—</p>
      </div>
      <div class="spacer"></div>
      <div class="search only-desktop" id="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.6-3.6"></path></svg>
        <span>Proje, sayfa veya görev ara…</span>
      </div>
      <button class="user-tile" id="user-tile" type="button" aria-label="Hesap">
        <span class="avatar">NA</span>
        <span class="user-text only-desktop">
          <span class="user-name">Nizam</span>
          <span class="user-role">Yönetici</span>
        </span>
      </button>
      <button class="btn btn-primary" id="topbar-action" type="button">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg>
        <span>Yeni Proje</span>
      </button>
    </header>

    <main id="view" class="view"></main>
  </div>

  <nav id="tabbar"></nav>
</div>

<div id="toast" class="hidden"></div>

<script src="vendor/supabase.js?v=2.112.3"></script>
<script src="config.js?v=0.9.5"></script>
<script src="auth.js?v=0.9.5"></script>
<script src="data.js?v=0.9.5"></script>
<script src="guncelle.js?v=0.9.5"></script>
<script src="prompt.js?v=0.9.5"></script>
<script src="app.js?v=0.9.5"></script>
</body>
</html>
