<!-- ===== Açılış ekranı ===== -->
<div id="loader">
  <div class="loader-box">
    <img class="loader-logo" src="logo-full.png?v=0.2.1" alt="NIZAM Studio" width="118" height="128">
    <div class="loader-sub">Nizam Soft</div>
    <div class="loader-track"><div class="loader-fill"></div></div>
    <div class="loader-msg">Hazırlanıyor…</div>
  </div>
  <div class="loader-foot">Yazılım Üretim Yönetim Sistemi</div>
</div>

<!-- ===== Giriş ekranı ===== -->
<div id="login" class="hidden">
  <form class="login-card" id="login-form" autocomplete="on">
    <img class="login-logo" src="logo-n.png?v=0.2.1" alt="" width="57" height="66">
    <h1>NIZAM <span class="pipe">|</span> Studio</h1>
    <p class="login-sub">Nizam Soft</p>

    <label class="field">
      <span>E-posta</span>
      <input type="email" id="login-mail" placeholder="ad@nizamsoft.com" autocomplete="username">
    </label>
    <label class="field">
      <span>Şifre</span>
      <input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password">
    </label>

    <p class="login-error hidden" id="login-error" role="alert"></p>

    <button class="btn btn-primary btn-block" type="submit"><span>Giriş Yap</span></button>
    <p class="login-note">Hesabı olmayan giremez. Erişim için yöneticine başvur.</p>
  </form>
</div>
