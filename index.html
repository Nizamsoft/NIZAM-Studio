<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Müşteri talebini yapılandırılmış göreve, AI promptuna ve çalışan sürüme çeviren üretim sistemi. Nizam Soft iç aracı.">

<!-- Link önizlemesi. Kazıyıcılar göreli adresi çözemiyor: hepsi tam adres.
     og.jpg 1200x630, 135 KB — WhatsApp büyük dosyada önizlemeyi atlıyor. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="NIZAM | Studio">
<meta property="og:locale" content="tr_TR">
<meta property="og:url" content="https://nizamsoft.github.io/NIZAM-Studio/">
<meta property="og:title" content="NIZAM | Studio">
<meta property="og:description" content="Müşteri talebini yapılandırılmış göreve, AI promptuna ve çalışan sürüme çeviren üretim sistemi.">
<meta property="og:image" content="https://nizamsoft.github.io/NIZAM-Studio/og.jpg?v=0.169.6">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="NIZAM | Studio — Nizam Soft yazılım üretim yönetim sistemi">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="NIZAM | Studio">
<meta name="twitter:description" content="Müşteri talebini yapılandırılmış göreve, AI promptuna ve çalışan sürüme çeviren üretim sistemi.">
<meta name="twitter:image" content="https://nizamsoft.github.io/NIZAM-Studio/og.jpg?v=0.169.6">

<link rel="canonical" href="https://nizamsoft.github.io/NIZAM-Studio/">
<title>NIZAM | Studio — Yazılım Üretim Yönetim Sistemi</title>

<link rel="manifest" href="manifest.webmanifest">
<!-- iOS ana ekran simgesi 180 piksel ister; 192 gelince yeniden ölçeklerdi. -->
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- black-translucent, sayfayı ekranın TEPESİNE yapıştırıp altta 59 piksel
     boş bırakıyordu (o siyah şerit). "black" ile sayfa durum çubuğunun
     altından başlar ve ekranın gerçek dibine kadar iner. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="NIZAM Studio">

<link rel="stylesheet" href="style.css?v=0.169.6">
</head>
<body>

<!-- ===== Açılış ekranı ===== -->
<div id="loader">
  <div class="loader-box">
    <img draggable="false" class="loader-logo" src="logo.png?v=0.169.6" alt="NIZAM Studio" width="89" height="128">
    <div class="loader-sub">Nizam Soft</div>
    <div class="loader-track"><div class="loader-fill"></div></div>
    <div class="loader-msg">Hazırlanıyor…</div>
  </div>
  <div class="loader-foot">Yazılım Üretim Yönetim Sistemi</div>
</div>

<!-- ===== Giriş ekranı ===== -->
<div id="login" class="hidden">
  <form class="login-card" id="login-form" autocomplete="on">
    <img class="login-logo" src="logo.png?v=0.169.6" alt="" width="46" height="66">
    <h1>NIZAM <span class="pipe">|</span> Studio</h1>
    <p class="login-sub">Nizam Soft</p>

    <label class="field">
      <span>E-posta</span>
      <input type="email" id="login-mail" placeholder="ad@nizamsoft.com" autocomplete="username">
    </label>
    <label class="field">
      <span>Şifre</span>
      <input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password">
    </label>

    <p class="login-error hidden" id="login-error" role="alert"></p>

    <button class="btn btn-primary btn-block" type="submit"><span>Giriş Yap</span></button>
    <p class="login-note">Hesabı olmayan giremez. Erişim için yöneticine başvur.</p>
  </form>
</div>

<!-- ===== Uygulama ===== -->
<div id="app" class="hidden">

  <!-- Yan menü koyu: uygulamanın gövdesi beyaz, menü siyah. Kullanıcı
       kutusu buradan kalktı, artık üst çubuğun sağında. -->
  <aside id="sidebar">
    <div class="brand">
      <img class="brand-logo" src="logo.png?v=0.169.6" alt="" width="19" height="28">
      <div class="brand-name">NIZAM <span>STUDIO</span></div>
    </div>

    <nav class="nav"></nav>

    <div class="spacer"></div>

    <!-- Menünün dibindeki söz kartı: hero'daki sözün küçük kardeşi. -->
    <div class="yan-soz">
      <p>Fikirleri gerçeğe dönüştüren bir çalışma alanı.</p>
      <span class="yan-cizgi"></span>
      <b>NIZAM <span>STUDIO</span></b>
    </div>

    <div class="rail-surum" id="rail-surum">—</div>
  </aside>

  <div id="main">
    <!-- Not defteri: tepeden açılan geçici karalama alanı. Kaydedilmez;
         boyunu alt kenarından çekerek ayarlarsın. -->
    <div id="notluk" class="kapali" aria-hidden="true">
      <div class="nt-ust">
        <b>Not defteri</b>
        <span class="nt-alt">kaydedilmez</span>
        <button class="nt-dug" id="nt-kopya" type="button">Kopyala</button>
        <button class="nt-dug" id="nt-temizle" type="button">Temizle</button>
        <button class="nt-kapat" id="nt-kapat" type="button" aria-label="Kapat">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </button>
      </div>
      <textarea id="nt-metin" spellcheck="false"
        placeholder="Aklına geleni yaz — sonra kopyalayıp Claude'a atarsın."></textarea>
      <div class="nt-tut" id="nt-tut" role="separator" aria-label="Boyu ayarla"><i></i></div>
    </div>

    <header id="topbar">
      <!-- Geri oku. Detay ekranlarında çıkar; üst düzey ekranlarda
           gizlenir (mobilde alt çubuk zaten gezinmeyi taşıyor). -->
      <button class="geri-ok pasif" id="btn-back" type="button" aria-label="Geri" disabled>
        <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"></path></svg>
      </button>
      <span class="logo-kutu"><img draggable="false" src="logo.png?v=0.169.6" alt="" width="17" height="24"></span>
      <div class="marka">
        <b id="firma-adi">NIZAM <span class="marka-ikinci">STUDIO</span></b>
        <!-- Sayfa adı yalnız masaüstünde görünür; mobilde alt çubuk zaten
             hangi ekranda olduğunu söylüyor ve satır yer yiyor. -->
        <i id="page-title">Panel</i>
      </div>
      <!-- Arama kutusu yalnız masaüstünde. Şimdilik yalnızca haber veriyor;
           arama özelliği henüz yazılmadı. -->
      <button class="ust-ara only-desktop" id="ust-ara" type="button">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.4"></circle><path d="M15.8 15.8L20.5 20.5"></path></svg>
        <span>Projelerde, görevlerde veya kişilerde ara…</span>
      </button>
      <div class="spacer"></div>
      <button class="btn btn-primary only-desktop" id="topbar-action" type="button">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg>
        <span>Yeni Proje</span>
      </button>
      <!-- Sohbet: yeri hazır, özelliği henüz yazılmadı. Kırmızı nokta
           okunmamış mesaj gelince açılacak; şimdilik gizli. -->
      <button class="zil" id="btn-sohbet" type="button" data-route="sohbet" aria-label="Sohbet">
        <svg viewBox="0 0 24 24">
          <path d="M6 4.5h12A2.5 2.5 0 0 1 20.5 7v6a2.5 2.5 0 0 1-2.5 2.5h-6.6l-3.6 3a.5.5 0 0 1-.8-.4v-2.6H6A2.5 2.5 0 0 1 3.5 13V7A2.5 2.5 0 0 1 6 4.5z"></path>
          <circle cx="8.6" cy="10" r=".95" fill="currentColor" stroke="none"></circle>
          <circle cx="12" cy="10" r=".95" fill="currentColor" stroke="none"></circle>
          <circle cx="15.4" cy="10" r=".95" fill="currentColor" stroke="none"></circle>
        </svg>
        <em class="zil-nokta hidden"></em>
      </button>
      <!-- Zil: bekleyen işin var mı? Süs değil — yöneticide onay bekleyen
           görev sayısını, geliştiricide kendi açık işlerini sayar. -->
      <button class="zil" id="btn-zil" type="button" aria-label="Bekleyen işler">
        <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 10-12 0c0 7-3 8-3 8h18s-3-1-3-8"></path><path d="M13.7 21a2 2 0 01-3.4 0"></path></svg>
        <em class="zil-nokta hidden"></em>
      </button>
      <button class="hesap" id="user-tile" type="button" aria-label="Hesap">
        <span class="foto"><b class="avatar">NA</b><em class="nokta hidden">0</em></span>
        <!-- Ad ve rol yalnız masaüstünde; mobilde yer yok, avatar yeter. -->
        <span class="hesap-yazi">
          <b class="user-name">Nizam</b>
          <i class="user-role">Yönetici</i>
        </span>
        <svg class="hesap-ok" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
    </header>

    <!-- Panelin zemini: ofis fotoğrafı. Yalnızca Panel'de görünür, ekranda
         sabit durur (kartlar üstünden akar), dokunmayı engellemez.
         Bulanıklık görselin kendisine pişirildi: çalışma anında hiçbir
         filtre yok. Kartlar da backdrop-filter kullanmıyor — kaydırırken
         sekiz kartın arkasını her karede yeniden bulanıklaştırmak
         takılmanın asıl sebebiydi. -->
    <div id="zemin-sus" aria-hidden="true">
      <img class="ofis" src="ofis.webp?v=0.169.6" alt="" width="1080" height="2334" draggable="false">
      <span class="ofis-perde"></span>
      <span class="hale-kirmizi"></span>
    </div>

    <main id="view" class="view"></main>
  </div>

  <nav id="tabbar"></nav>
</div>

<!-- Alt sekme simgelerinin kabartma gradyanları. Görünmez, yalnızca tanım taşır. -->
<svg width="0" height="0" aria-hidden="true" style="position:absolute">
  <defs>
    <!-- Panel ilerleme halkası -->
    <linearGradient id="halka-metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f0ed"></stop>
      <stop offset=".5" stop-color="#c2bab4"></stop>
      <stop offset="1" stop-color="#7a716a"></stop>
    </linearGradient>
    <linearGradient id="yan-kirmizi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#932018"></stop>
      <stop offset="1" stop-color="#5a110c"></stop>
    </linearGradient>
  </defs>
</svg>

<div id="toast" class="hidden"></div>

<script src="vendor/supabase.js?v=0.169.6"></script>
<script src="config.js?v=0.169.6"></script>
<script src="auth.js?v=0.169.6"></script>
<script src="data.js?v=0.169.6"></script>
<script src="guncelle.js?v=0.169.6"></script>
<script src="prompt.js?v=0.169.6"></script>
<script src="app.js?v=0.169.6"></script>
</body>
</html>
